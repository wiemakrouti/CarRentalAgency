services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: car_rental_agence
    # No host port mapping — only reachable from other containers on this
    # compose network, never exposed on the VPS's public interface.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/car_rental_agence?schema=public
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      APP_URL: https://${DOMAIN:?DOMAIN is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    # No host port mapping either — only Caddy talks to it, over the
    # compose network, by service name.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same domain as the backend — Caddy below routes /api/* on this
        # same origin to the backend container, so the browser never makes
        # a cross-origin request at all.
        VITE_API_URL: https://${DOMAIN:?DOMAIN is required}/api/v1
    restart: unless-stopped
    depends_on:
      - backend

  # Reverse proxy + automatic HTTPS (Let's Encrypt) — the only service with
  # ports open to the internet. Needs DOMAIN's DNS A record already pointing
  # at this VPS before first boot, or certificate issuance fails.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
