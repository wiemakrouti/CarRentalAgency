<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable on a phone's home screen, opening without the browser's bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAFBFD" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Location" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gestion Location de Voitures</title>
    <script>
      (function () {
        var stored = localStorage.getItem('car-rental-theme');
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        // Same colours as ThemeProvider's THEME_COLORS.
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#0E121C' : '#FAFBFD';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
